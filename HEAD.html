    /* ========================================
       WHY WATERJET — BENEFIT TILES

    /* ========================================

      box-shadow: 0 8px 20px rgba(0,123,133,0.4);

    .aih-eng-content h2 { font-size: 38px; font-weight: 700; color: #000000; margin: 0 0 18px 0; line-height: 1.2; }
    .aih-eng-content p.body { font-size: 17px; color: #424242; line-height: 1.7; margin: 0 0 24px 0; }
    .aih-eng-list { list-style: none; padding: 0; margin: 0 0 24px 0; }
    .aih-eng-list li {

    }
    .aih-eng-list li:last-child { border-bottom: none; }
    .aih-eng-list li::before {
      content: "✓";
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #007b85 0%, #005662 100%);
      color: #ffffff;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,123,133,0.25);

      .aih-eng-content h2 { font-size: 30px; }
    }

    /* ========================================
       FADING IMAGE ROTATOR (shared)
       ======================================== */
    .aih-rotator {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.25);
      background: #000000;
    }
    .aih-rotator--split {
      aspect-ratio: auto;
      height: 100%;
      min-height: 520px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.18);
      border-radius: 16px;
    }
    .aih-rotator-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      animation: aihRotatorFade 32s linear infinite;
    }
    .aih-rotator-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .aih-rotator-slide:nth-child(1) { animation-delay: 0s; }
    .aih-rotator-slide:nth-child(2) { animation-delay: 4s; }
    .aih-rotator-slide:nth-child(3) { animation-delay: 8s; }
    .aih-rotator-slide:nth-child(4) { animation-delay: 12s; }
    .aih-rotator-slide:nth-child(5) { animation-delay: 16s; }
    .aih-rotator-slide:nth-child(6) { animation-delay: 20s; }
    .aih-rotator-slide:nth-child(7) { animation-delay: 24s; }
    .aih-rotator-slide:nth-child(8) { animation-delay: 28s; }
    @keyframes aihRotatorFade {
      0%    { opacity: 0; }
      1.5%  { opacity: 1; }
      11%   { opacity: 1; }
      12.5% { opacity: 0; }
      100%  { opacity: 0; }
    }
    .aih-rotator-caption {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(30,47,92,0.9);
      backdrop-filter: blur(6px);
      border-left: 4px solid #007b85;
      border-radius: 10px;
      padding: 12px 18px;
      z-index: 2;
      max-width: calc(100% - 40px);
    }
    .aih-rotator-caption .num {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      display: block;
      margin-bottom: 3px;
    }
    .aih-rotator-caption .label {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }
    @media (max-width: 768px) {
      .aih-rotator--split { min-height: 380px; }
      .aih-rotator-caption { bottom: 12px; left: 12px; padding: 10px 14px; }
    }

    /* ========================================
       CONTACT / REQUEST A QUOTE
       ======================================== */
    .aih-contact-section { background: #ffffff; padding: 90px 20px; }
    .aih-contact-wrapper { max-width: 1100px; margin: 0 auto; }
    .aih-contact-grid {
      display: grid;

    .aih-contact-card {

      color: #ffffff;

      overflow: hidden;
    }
    .aih-contact-card::before {

    .aih-contact-card > * { position: relative; }
    .aih-contact-card p.eyebrow { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.8px; color: #007b85; margin: 0 0 14px 0; }
    .aih-contact-card h2 { font-size: 32px; font-weight: 700; color: #ffffff; margin: 0 0 16px 0; line-height: 1.2; }
    .aih-contact-card p.lead { font-size: 16px; color: rgba(255,255,255,0.85); line-height: 1.6; margin: 0 0 28px 0; }
    .aih-contact-details { display: flex; flex-direction: column; gap: 18px; margin-bottom: 28px; }
    .aih-contact-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .aih-contact-row-icon {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(0,123,133,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #ffffff;
    }
    .aih-contact-row-text .label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.6);

      margin-bottom: 2px;
    }
    .aih-contact-row-text .value {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      display: block;
    }
    .aih-contact-row-text a { color: #ffffff; text-decoration: none; }
    .aih-contact-row-text a:hover { color: #007b85; }
    .aih-contact-benefits {
      background: #F5F5F5;
      border-radius: 16px;
      padding: 44px 40px;
    }
    .aih-contact-benefits p.eyebrow { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.8px; color: #007b85; margin: 0 0 14px 0; }
    .aih-contact-benefits h3 { font-size: 26px; font-weight: 700; color: #000000; margin: 0 0 16px 0; line-height: 1.25; }
    .aih-contact-benefits p.body { font-size: 15px; color: #424242; line-height: 1.6; margin: 0 0 24px 0; }
    .aih-contact-list { list-style: none; padding: 0; margin: 0; }
    .aih-contact-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #E0E0E0;
      font-size: 15px;
      font-weight: 600;
      color: #000000;
      line-height: 1.4;
    }
    .aih-contact-list li:last-child { border-bottom: none; }
    .aih-contact-list li::before {
      content: "→";
      flex-shrink: 0;
      color: #007b85;
      font-weight: 700;
      font-size: 16px;
      line-height: 1.3;
    }
    @media (max-width: 820px) {
      .aih-contact-grid { grid-template-columns: 1fr; gap: 24px; }
      .aih-contact-card, .aih-contact-benefits { padding: 32px 28px; }
    }

    /* UTILITY */
    .applied-section-padding { padding: 80px 20px; }
    .applied-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    @media (max-width: 768px) { .applied-section-padding { padding: 60px 20px; } }
